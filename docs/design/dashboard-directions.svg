<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2250" viewBox="0 0 1440 2250" role="img" aria-labelledby="title desc">
<title id="title">Deployment overview and Feed detail, revision five</title>
<desc id="desc">The deployment overview combines marked-read activity, starred state, Feed health and polling outcomes. Feeds lists current status and opens a Feed detail page with history and grouped errors. Reading provides deeper metrics by Feed. Access stays simple. All data is illustrative; controls are not implemented.</desc>
